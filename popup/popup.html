<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quit YouTube</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        width: 280px;
        padding: 16px;
        background: #0f0f0f;
        color: #f1f1f1;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 4px;
      }

      .logo {
        width: 32px;
        height: 32px;
        flex-shrink: 0;
        border-radius: 7px;
      }

      h1 {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 0;
      }

      p {
        font-size: 12px;
        color: #aaa;
        margin-bottom: 16px;
        line-height: 1.4;
      }

      label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
      }

      .toggle {
        position: relative;
        width: 44px;
        height: 24px;
        flex-shrink: 0;
      }

      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        background: #3f3f3f;
        border-radius: 24px;
        transition: background 0.2s;
      }

      .slider::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 3px;
        bottom: 3px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }

      input:checked + .slider {
        background: #3ea6ff;
      }

      input:checked + .slider::before {
        transform: translateX(20px);
      }
    </style>
  </head>
  <body>
    <div class="header">
      <img class="logo" src="../icons/icon48.png" width="32" height="32" alt="" />
      <h1>Quit YouTube</h1>
    </div>
    <p>Read videos like an article without thumbnails.</p>
    <label>
      Text-only mode
      <span class="toggle">
        <input type="checkbox" id="enabled" checked />
        <span class="slider"></span>
      </span>
    </label>
    <script src="popup.js"></script>
  </body>
</html>
