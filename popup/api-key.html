<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TLDR API Key</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        background: #0f0f0f;
        color: #f1f1f1;
        min-width: 320px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        margin-bottom: 12px;
        border: 1px solid #3f3f3f;
        border-radius: 6px;
        background: #1a1a1a;
        color: #f1f1f1;
      }
      button {
        padding: 8px 16px;
        border: none;
        border-radius: 999px;
        background: #3ea6ff;
        color: #0f0f0f;
        font-weight: 700;
        cursor: pointer;
      }
      p {
        margin: 12px 0 0;
        font-size: 12px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <label for="api-key">Google AI API key for TLDR</label>
    <input id="api-key" type="password" autocomplete="off" />
    <button id="save" type="button">Save</button>
    <p>Stored locally in this extension only. Get a key at aistudio.google.com/apikey</p>
    <script src="api-key.js"></script>
  </body>
</html>
